name: Build Windows Installer

on:
  push:
    branches: [ "main" ]
  release:
    types: [published]
  workflow_dispatch:        # Allows manual triggers from the GitHub UI

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13' # Match your project's version
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if (Test-Path requirements.txt) { pip install -r requirements.txt }

    - name: Install Inno Setup
      run: choco install innosetup

    - name: Build Documentation
      working-directory: ./helpdocs
      run: mkdocs build --clean

    - name: Build Executable with PyInstaller
      run: |
        pyinstaller --clean --log-level=ERROR --noconfirm pythonbuild/pairsutility.spec

    - name: Copy default config file to output before packaging
      shell: powershell
      run: |
        Copy-Item -Path "./config.init.json" -Destination "dist/PairsStrat/config.json" -Force
    
    - name: Compile Installer with Inno Setup
      run: |
        & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" pythonbuild/PairsUtility.iss

      # THIS STEP ONLY RUNS IF TRIGGERED BY A PUBLISHED RELEASE
    - name: Sign Binary (Release Only)
      if: github.event_name == 'release'
      run: echo "Run your signing command or action here"

    - name: Upload Installer Artifact (Non-release only)
      if: github.event_name != 'release'
      uses: actions/upload-artifact@v4
      with:
        name: Windows-Installer
        path: installer_output/PairsStrat-Setup.exe

    - name: Attach signed binary to Github Release
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v1
      with:
        name: Windows Installer
        files: installer_output/PairsStrat-Setup.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
