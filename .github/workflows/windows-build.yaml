name: Build Windows Installer

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # Allows manual triggers from the GitHub UI

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13' # Match your project's version
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if (Test-Path requirements.txt) { pip install -r requirements.txt }

    - name: Install Inno Setup
      run: choco install innosetup

    - name: Build Documentation
      working-directory: ./helpdocs
      run: mkdocs build --clean

    - name: Build Executable with PyInstaller
      run: |
        pyinstaller --clean --log-level=ERROR --noconfirm pythonbuild/pairsutility.spec

    - name: Copy default config file to output before packaging
      shell: powershell
      run: |
        Copy-Item -Path "./config.init.json" -Destination "dist/PairsStrat/config.json" -Force
    
    - name: Compile Installer with Inno Setup
      run: |
        & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" pythonbuild/PairsUtility.iss

    - name: Upload Installer Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Windows-Installer
        path: installer_output/PairsStrat-Setup.exe
